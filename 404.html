<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Страница не найдена · Matematika PEC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/pec-matematika/favicon.svg" type="image/svg+xml">
<style>
:root { --bg: #1F2933; --fg: #FFFFFF; --muted: #AEB7C2; --accent: #8DB8EC; color-scheme: dark }
* { box-sizing: border-box }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg);
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 24px 24px;
}
main { max-width: 560px; display: grid; gap: 20px }
.k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
h1 { font-size: clamp(32px, 8vw, 48px); line-height: 1.05; margin: 0; letter-spacing: -.015em }
p { color: var(--muted); margin: 0; line-height: 1.55 }
nav { display: flex; flex-wrap: wrap; gap: 12px }
a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 600; text-decoration: none }
a.main { background: var(--accent); color: #0F1720 }
a.alt { border: 1px solid #3A4552; color: var(--fg) }
a:focus-visible { outline: 3px solid #E0C15A; outline-offset: 3px }
</style>
</head>
<body>
<main>
  <div class="k">Ошибка 404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Все материалы курса — на страницах линий.</p>
  <nav>
    <a class="main" href="/pec-matematika/">На главную</a>
    <a class="alt" href="/pec-matematika/vse/">VŠE</a>
    <a class="alt" href="/pec-matematika/cvut/">ČVUT</a>
  </nav>
</main>
<script defer src="/pec-matematika/assets/extras.js"></script>
</body>
</html>
